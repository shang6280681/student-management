<h2 mat-dialog-title>{{data ? 'Edit Course' : 'Add Course'}}</h2><mat-dialog-content><form [formGroup]="form" class="form"><mat-form-field appearance="outline"><mat-label>Course Name</mat-label><input matInput formControlName="name"><mat-error *ngIf="form.get('name')?.hasError('required')">Name required</mat-error><mat-error *ngIf="form.get('name')?.hasError('maxlength')">Maximum 100 characters</mat-error></mat-form-field><mat-form-field appearance="outline"><mat-label>Description</mat-label><textarea matInput formControlName="description" rows="3"></textarea><mat-error *ngIf="form.get('description')?.hasError('maxlength')">Maximum 500 characters</mat-error></mat-form-field></form></mat-dialog-content><mat-dialog-actions align="end"><button mat-button (click)="ref.close()">Cancel</button><button mat-flat-button [disabled]="form.invalid" (click)="save()">Save</button></mat-dialog-actions>
