<div class="header"><h2>Courses</h2><button mat-flat-button (click)="add()">Add Course</button></div>
<table mat-table [dataSource]="(courses$|async)??[]" class="mat-elevation-z2">
<ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef>Course Name</th><td mat-cell *matCellDef="let c">{{c.name}}</td></ng-container>
<ng-container matColumnDef="description"><th mat-header-cell *matHeaderCellDef>Description</th><td mat-cell *matCellDef="let c">{{c.description}}</td></ng-container>
<ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef>Actions</th><td mat-cell *matCellDef="let c"><button mat-button (click)="edit(c)">Edit</button><button mat-button color="warn" (click)="remove(c)">Delete</button></td></ng-container>
<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr><tr mat-row *matRowDef="let row;columns:displayedColumns"></tr></table>
