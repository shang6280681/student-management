<div class="header"><h2>Students</h2><button mat-flat-button (click)="add()">Add Student</button></div>
<table mat-table [dataSource]="(students$|async)??[]" class="mat-elevation-z2">
<ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef>Name</th><td mat-cell *matCellDef="let s">{{s.name}}</td></ng-container>
<ng-container matColumnDef="email"><th mat-header-cell *matHeaderCellDef>Email</th><td mat-cell *matCellDef="let s">{{s.email}}</td></ng-container>
<ng-container matColumnDef="courses"><th mat-header-cell *matHeaderCellDef>Courses</th><td mat-cell *matCellDef="let s">{{courseNames(s.courseIds)}}</td></ng-container>
<ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef>Actions</th><td mat-cell *matCellDef="let s"><button mat-button (click)="edit(s)">Edit</button><button mat-button color="warn" (click)="remove(s)">Delete</button></td></ng-container>
<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr><tr mat-row *matRowDef="let row;columns:displayedColumns"></tr></table>
